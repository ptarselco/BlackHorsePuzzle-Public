<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Payment Verification</title>
  <style>
    body {
      background-color: #1b1b1b;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .loader {
      border: 8px solid #333;
      border-top: 8px solid #00cc99;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    h2 {
      font-weight: normal;
      max-width: 400px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

<body>
  <div class="loader"></div>
  <h2>Verifying your payment...<br>Please wait a moment</h2>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const payerID = params.get('PayerID');
    const email = params.get('email');
    const txnId = params.get('txnId');
   
    if (!txnId || !email) {
      alert("❌ Missing payment information.");
      window.location.href = "/index.html";
    }

  // 3. VERIFIKASI TOKEN PAYPAL 
  if (!token || !payerID || !email) {
    alert("❌ Missing PayPal payment information.");
    window.location.href = "/index.html";
  } else {
   // Verifikasi pembayaran ke backend 
  axios.post('https://backend-paypalblackhorsepuzzle.onrender.com/api/verify-paypal-token', {
    token,
    payerID,
    email
  }, { timeout: 5000 })
    .then(res => {
      const data = res.data;
      if (data.emailVerified) {
        localStorage.setItem(`paymentVerified_${email}`, 'true');
        localStorage.removeItem(`gameOver_${email}`);
        //localStorage.setItem(`score_${email}`, "0");
        // Unlock level jika scene aktif
        if (window.Level01Scene && typeof window.Level01Scene.prototype.unlockGameAfterPurchase === 'function') {
          const scene = window.game && window.game.scene && window.game.scene.getScene('Level01Scene');
          if (scene && typeof scene.unlockGameAfterPurchase === 'function') {
            scene.unlockGameAfterPurchase();
          }
        }
        window.location.href = "/index.html";
      } else {
        alert("❌ Payment not verified yet.");
        window.location.href = "/payment-error.html";
      }
    })
    .catch(err => {
      console.error("Verification error:", err);
      alert("❌ Failed to verify payment.");
      window.location.href = "/payment-error.html";
    });
    }

//3. **CEK STATUS PEMBAYARAN SUKSES**
async function handlePaymentSuccess(email) {
  try {
    const res = await axios.get(`https://backend-paypalblackhorsepuzzle.onrender.com/api/payment-status/${email}`);
    const data = res.data;

    if (data && data.paid === true) {
      // Tandai payment verified di localStorage
      localStorage.setItem(`paymentVerified_${email}`, 'true');
      localStorage.removeItem(`gameOver_${email}`);
      //localStorage.setItem(`score_${email}`, "0");

      // Unlock level jika scene aktif
      if (window.Level01Scene && typeof window.Level01Scene.prototype.unlockGameAfterPurchase === 'function') {
        const scene = window.game && window.game.scene && window.game.scene.getScene('Level01Scene');
        if (scene && typeof scene.unlockGameAfterPurchase === 'function') {
          scene.unlockGameAfterPurchase();
        }
      }
      // Redirect ke halaman utama
      window.location.href = "/index.html";
    } else {
      alert("❌ Payment not verified yet.");
      window.location.href = "/payment-error.html";
    }
  } catch (err) {
    console.error("Verification error:", err);
    alert("❌ Failed to verify payment.");
    window.location.href = "/payment-error.html";
  }
}

// 4. CEK STATUS PEMBAYARAN DARI BACKEND
async function handlePaymentSuccess(email) {
  try {
    // Cek status pembayaran dari backend
    const response = await axios.get(
      'https://backend-paypalblackhorsepuzzle.onrender.com/api/check-payment',
      {
        params: { userId: email },
        timeout: 5000,
        headers: { 'Accept': 'application/json' }
      }
    );
    const data = response.data;

    if (data && data.paid === true) {
      localStorage.setItem(`paymentVerified_${email}`, 'true');
      localStorage.removeItem(`gameOver_${email}`);
      //localStorage.setItem(`score_${email}`, "0");
      // --Unlock level jika scene aktif--
      if (window.Level01Scene && typeof window.Level01Scene.prototype.unlockGameAfterPurchase === 'function') {
        const scene = window.game && window.game.scene && window.game.scene.getScene('Level01Scene');
        if (scene && typeof scene.unlockGameAfterPurchase === 'function') {
          scene.unlockGameAfterPurchase();
        }
      }
      //--unlock game dan redirect--
      window.location.href = "/index.html";
    } else {
      alert("❌ Payment not verified yet.");
      window.location.href = "/payment-error.html";
    }
  } catch (err) {
    console.error("Verification error:", err);
    alert("❌ Failed to verify payment.");
    window.location.href = "/payment-error.html";
  }
}
