<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Black Horse Puzzle</title>
    <!-- Mobile Viewport -->

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">

     <!-- Phaser -->

    <!-- Service Worker -->
    <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker registered ✅', reg))
        .catch(err => console.log('Service Worker failed ⛔', err));
      });

   </script>
   

    <!-- STYLE -->
    <style>
      .hide-on-loading {
       display: none!important;
  }
     html,body {
  
        margin: 0;
        padding: 0;
        background: #181c24;
        font-family: 'Segoe UI', 'Arial', sans-serif;
        overflow: auto;  /* ⬅️ penting untuk scroll/geser */
        height: 100%; 
        }

       .help-image {
        max-width: 100%;
        height: auto;
        display: block;
        margin: 16px auto;
        border-radius: 8px;
        box-shadow: 0 2px 16px #0002;
      } 
    
     canvas {
        display: block;
         max-width: 100vw;
         max-height: 100vh;
         margin: 0 auto;
        touch-action: pan-x pan-y;
        user-select: none;
        -webkit-user-drag: none;
      }

  

     #loginBox {
  position: absolute;
  top: 6%;
  left: 88%;
  transform: translate(-50%, -50%);
  background: rgba(30, 34, 44, 0.92);
  border-radius: 12px;
  box-shadow: 0 4px 24px #00eaff40;
  padding: 18px 24px 14px 24px;
  min-width: 340px;
  z-index: 1000;
  display: none;
  text-align: center;
  border: 1.5px solid #00eaff;
  backdrop-filter: blur(6px);
} 
.login-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
  
#loginBox input[type="text"] {
  width: 200px; /* Lebar input */
  padding: 8px 10px;
  border: 1.2px solid #00eaff;
  border-radius: 7px;
  font-size: 1em;
  background: #23283a;
  color: #fff;
  outline: none;
  box-shadow: 0 0 6px #00eaff40 inset;
  transition: border 0.2s;
}
#loginBox input[type="text"]:focus {
  border: 1.2px solid #fff;
}
#loginBox button {
  background: linear-gradient(90deg, #00eaff 0%, #0078ff 100%);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 8px 22px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 12px #00eaff60;
  letter-spacing: 1px;
  transition: background 0.2s, box-shadow 0.2s;
}
  #loginBox #logoutBtn {
  background: #222;
  color: #fff;
  border: 1px solid #00eaff;
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 0.95em;
  margin-left: 6px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}
#loginBox #logoutBtn:hover {
  background: #00eaff;
  color: #181c24;
}
#logoutBtn {
  background: #222;
  color: #fff;
  border: 1px solid #00eaff;
  border-radius: 7px;
  padding: 7px 16px;
  font-size: 0.95em;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px #00eaff60;
}
#logoutBtn:hover {
  background: #00eaff;
  color: #181c24;
}

#loginBox button:hover {
  background: linear-gradient(90deg, #0078ff 0%, #00eaff 100%);
  box-shadow: 0 0 18px #00eaffcc;
} 
    </style>
  </head>
 
 <body>
  <!-- Game Container -->
  <div id="game-container"></div> 

   <!-- 🐎 Loading Screen -->
<div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #181c24;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  font-family: 'Segoe UI', sans-serif;
  color: #00eaff;
  font-size: 1.3em;
">
  <div class="loader-text" style="line-height:1.6;">
    <img src="Black Horse-Please Wait.png" alt="Black Horse" style="height: 120px; vertical-align: middle; margin-right: 8px;">
    Please wait... Preparing the GAME PUZZLE FUTURISTIC.<br>
     <span style="font-size:0.95em; color:#fff; margin-top:8px; display:block;">
    For best experience on mobile, use the <b>Google</b> browser or "Add to Home Screen" for fullscreen.
  </span>
  </div>

  <!-- Help Images -->
  <a href="help-en.png" target="_blank">
    <img src="help-en.png" alt="Help English" class="help-image hide-on-loading">
  </a>
  <a href="help-id.png" target="_blank">
    <img src="help-id.png" alt="Help Indonesia" class="help-image hide-on-loading">
  </a>

  <body>
    <!-- === Form login === -->
    <div id="loginBox">
      <div class="login-row">
    <input type="text" id="emailInput" placeholder="Email" autocomplete="off" />
      <button id="loginBtn">Login</button>
      </div>
      </div>
      <button id="logoutBtn" style="display:none; position: absolute; top: 18px; right: 32px; z-index: 1100;">Logout</button>
      </div>
    <!-- === End form login === -->
   
      // hapus loading screen please wait
  

    <!-- Load semua scene dulu -->
    <script src="./Scenes/SplashScene.js"></script>
    <script src="./Scenes/Level01Scene.js"></script>
    <script src="./Scenes/Level02Scene.js"></script>

    <!-- Game(Baru load main.js) -->
    <script src="./main.js"></script>
    <script>
      // Agar mouse wheel di atas canvas tetap scroll halaman, walau canvas diganti/direfresh Phaser
      function addScrollToCanvas() {
        const canvas = document.querySelector('canvas');
        if (canvas && !canvas._scrollListenerAdded) {
          canvas.addEventListener('wheel', function(e) {
            window.scrollBy(0, e.deltaY);
          });
          canvas._scrollListenerAdded = true;
        }
      }

 
    window.addEventListener('DOMContentLoaded', function() {
  let playerEmail = localStorage.getItem("playerEmail");
  if (playerEmail) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
  } else {
      document.getElementById("emailInput").style.display = "inline-block";
      document.getElementById("loginBtn").style.display = "inline-block";
      document.getElementById("logoutBtn").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
  }

  document.getElementById("loginBtn").onclick = function() {
    const inputEmail = document.getElementById('emailInput').value.trim();
    if (inputEmail) {
      localStorage.setItem("playerEmail", inputEmail);
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
      if (window.Phaser && window.game && window.game.scene) {
        window.game.scene.scenes.forEach(scene => scene.scene.restart());
      }
    } else {
      alert("Input Email!");
    }
  };

  document.getElementById("logoutBtn").onclick = function() {
    localStorage.removeItem("playerEmail");
    document.getElementById("emailInput").value = "";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("emailInput").style.display = "inline-block";
    document.getElementById("loginBtn").style.display = "inline-block";
    document.getElementById("logoutBtn").style.display = "none";
    if (window.Phaser && window.game && window.game.scene) {
      window.game.scene.scenes.forEach(scene => scene.scene.restart());
    }
  };
  // ⬅️ PANGGIL DI SINI
    addScrollToCanvas();
});
</script> 
     
  </body>
</html>
