<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes">
    <title>Black Horse Puzzle</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="192x192" href="android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="android-chrome-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" href="favicon.ico">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3/dist/phaser.js"></script>
    <script>
    if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js')
        .then(reg => console.log('Service Worker registered ✅', reg))
        .catch(err => console.log('Service Worker failed ⛔', err));
      });
    }
   </script>
  
    <style>
     html,body {
        margin: 0;
        padding: 0;
        background: #181c24;
        font-family: 'Segoe UI', 'Arial', sans-serif;
        overflow: auto;
        height: 100%;
      }
      canvas {
        display: block;
         max-width: 100vw;
         max-height: 100vh;
        margin: 0 auto;
      }
    
     #loginBox {
  position: absolute;
  top: 6%;
  left: 88%;
  transform: translate(-50%, -50%);
  background: rgba(30, 34, 44, 0.92);
  border-radius: 12px;
  box-shadow: 0 4px 24px #00eaff40;
  padding: 18px 24px 14px 24px;
  min-width: 340px;
  z-index: 1000;
  display: none;
  text-align: center;
  border: 1.5px solid #00eaff;
  backdrop-filter: blur(6px);
} 
.login-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
}
  
#loginBox input[type="text"] {
  width: 200px; /* Lebar input */
  padding: 8px 10px;
  border: 1.2px solid #00eaff;
  border-radius: 7px;
  font-size: 1em;
  background: #23283a;
  color: #fff;
  outline: none;
  box-shadow: 0 0 6px #00eaff40 inset;
  transition: border 0.2s;
}
#loginBox input[type="text"]:focus {
  border: 1.2px solid #fff;
}
#loginBox button {
  background: linear-gradient(90deg, #00eaff 0%, #0078ff 100%);
  color: #fff;
  border: none;
  border-radius: 7px;
  padding: 8px 22px;
  font-size: 1em;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 0 12px #00eaff60;
  letter-spacing: 1px;
  transition: background 0.2s, box-shadow 0.2s;
}
  #loginBox #logoutBtn {
  background: #222;
  color: #fff;
  border: 1px solid #00eaff;
  border-radius: 7px;
  padding: 8px 14px;
  font-size: 0.95em;
  margin-left: 6px;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
}
#loginBox #logoutBtn:hover {
  background: #00eaff;
  color: #181c24;
}
#logoutBtn {
  background: #222;
  color: #fff;
  border: 1px solid #00eaff;
  border-radius: 7px;
  padding: 7px 16px;
  font-size: 0.95em;
  cursor: pointer;
  transition: background 0.2s, box-shadow 0.2s;
  box-shadow: 0 0 8px #00eaff60;
}
#logoutBtn:hover {
  background: #00eaff;
  color: #181c24;
}

#loginBox button:hover {
  background: linear-gradient(90deg, #0078ff 0%, #00eaff 100%);
  box-shadow: 0 0 18px #00eaffcc;
} 
    </style>
  </head>

  <body>
    <!-- Game Container -->
  <div id="game-container"></div>

   <!-- 🐎 Loading Screen -->
<div id="loader" style="
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;
  background: #034054;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  font-family: 'Segoe UI', sans-serif;
  color: #00eaff;
  font-size: 1.2em;
">
  
 <div class="loader-text" >
    <img src="Black Horse-Please Wait.png" alt="Black Horse" style="height: 300px; vertical-align: middle; margin-right: 8px;">
    Please wait... Preparing the BLACK HORSE GAME PUZZLE FUTURISTIC.<br>
     <span style="font-size:1.2em; color:#fff; margin-top:8px; display:block;">
    Best on desktop or laptop for full experience. On Mobile, use the <b>Google</b> browser or "Add to Home Screen" for fullscreen<br>
  </span>
  </div>
  </div>
 
  
  <!-- === Form login === -->
    <div id="loginBox">
      <div class="login-row">
    <input type="text" id="emailInput" placeholder="Email" autocomplete="off" />
      <button id="loginBtn">Login</button>
      </div>
      </div>
      <button id="logoutBtn" style="display:none; position: absolute; top: 18px; right: 32px; z-index: 1100;">Logout</button>
      </div>

    <!-- === End form login === -->

     <!-- Load main.js -->
    <script src="./main.js"></script>
    <script src="./Scenes/SplashScene.js"></script>
    <script src="./Scenes/Level01Scene.js"></script>
    <script src="./Scenes/Level02Scene.js"></script>

   
  
   
   <script>
      // Agar mouse wheel di atas canvas tetap scroll halaman, walau canvas diganti/direfresh Phaser
      function addScrollToCanvas() {
        const canvas = document.querySelector('canvas');
        if (canvas && !canvas._scrollListenerAdded) {
          canvas.addEventListener('wheel', function(e) {
            window.scrollBy(0, e.deltaY);
          });
          canvas._scrollListenerAdded = true;
        }
      }
  
  //window.addEventListener('load', addScrollToCanvas);    
  window.addEventListener('DOMContentLoaded', function() {
  let playerEmail = localStorage.getItem("playerEmail");
  if (playerEmail) {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";
  } else {
      document.getElementById("emailInput").style.display = "inline-block";
      document.getElementById("loginBtn").style.display = "inline-block";
      document.getElementById("logoutBtn").style.display = "none";
      document.getElementById("loginBox").style.display = "block";
  }

  document.getElementById("loginBtn").onclick = function(event) {
    event.preventDefault(); // <-- Tambahkan ini!
    const inputEmail = document.getElementById('emailInput').value.trim();
   
   // Check if input is empty 
    if (!inputEmail) {
    alert("Please enter your email address!");
    return;
  }

    /* Simple email format validation */ 
  const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  if (!emailPattern.test(inputEmail)) {
    alert("Please enter a valid email address!");
    return;
  }

      // ✅ Simpan email ke localStorage (sudah ada sebelumnya)
     localStorage.setItem("playerEmail", inputEmail);
      // Ambil score sesuai email, jika belum ada set ke 0
     let userScore = parseInt(localStorage.getItem(`score_${inputEmail}`) || 0);

     // Kirim score ke scene Phaser (misal Level01Scene)
  if (window.Phaser && window.game && window.game.scene) {
    const level01 = window.game.scene.getScene('Level01Scene');
    if (level01 && typeof level01.score !== 'undefined') {
      level01.score = userScore;
      if (level01.scoreText) {
        level01.scoreText.setText('Score: ' + userScore);
      }
    }
  }

      // ✅ Lanjut tampilkan UI dan masuk scene (sudah ada sebelumnya)
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("logoutBtn").style.display = "inline-block";

     
      //  window.game.scene.scenes.forEach(scene => scene.scene.restart());
     if (window.Phaser && window.game && window.game.scene) {
      setTimeout(() => {
      window.game.scene.start('Level01Scene'); // <--  scene Level01 jadi klik 2x, pakai splashscene aja 
      }, 300); // 300ms, bisa disesuaikan
    }
  };

  document.getElementById("logoutBtn").onclick = function() {
    localStorage.removeItem("playerEmail");
    document.getElementById("emailInput").value = "";
    document.getElementById("loginBox").style.display = "block";
    document.getElementById("emailInput").style.display = "inline-block";
    document.getElementById("loginBtn").style.display = "inline-block";
    document.getElementById("logoutBtn").style.display = "none";

    // Reset skor di game (jika ada variabel global score)
    if (window.score !== undefined) window.score = 0;
    window.playerScore = 0; // Atau set ke variabel score di scene

    if (window.Phaser && window.game && window.game.scene) {
    window.game.scene.scenes.forEach(scene => scene.scene.restart());
    const level01 = window.game.scene.getScene('Level01Scene');
    if (level01 && level01.playBtn) {
     level01.playBtn.disableInteractive();
      level01.playBtn.setAlpha(0.5);
    }
  
    // window.game.scene.scenes.forEach(scene => scene.scene.restart());
    document.getElementById("loginBtn").disabled = true;//atasi klik 2x login setelah logout
    setTimeout(() => {
     window.game.scene.start('SplashScene'); // <-- arahkan ke SplashScene setelah logout
     document.getElementById("loginBtn").disabled = false; //atasi klik 2x login setelah logout
    }, 1500);
    }
  };
});   
</script> 
</body>
</html>
